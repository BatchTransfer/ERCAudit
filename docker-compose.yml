# ERCAudit web service behind Caddy (automatic HTTPS).  Usage:  cp .env.example .env  &&  docker compose up -d --build
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "${WEB_BIND:-127.0.0.1}:8000:8000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
